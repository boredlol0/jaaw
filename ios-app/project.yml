name: Jaaw

options:
  bundleIdPrefix: com.boredlol
  projectFormat: xcode16_0

targets:
  Jaaw:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - Jaaw

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boredlol.jaaw
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SDKROOT: iphoneos
        INFOPLIST_FILE: Jaaw/Info.plist

    info:
      path: Jaaw/Info.plist
      properties:
        CFBundleDisplayName: "JAAW"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"