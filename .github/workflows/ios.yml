name: iOS Build

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: jaaw-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Initialize Simulator Control
        run: xcrun simctl list > /dev/null

      - name: Download iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build
        run: |
          xcodebuild \
            -project "jaaw-ios.xcodeproj" \
            -scheme "jaaw-ios" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p artifacts/Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/jaaw-ios.app" \
            "artifacts/Payload/"

          cd artifacts
          zip -r "Jaaw.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jaaw-ios
          path: jaaw-ios/artifacts/Jaaw.ipa