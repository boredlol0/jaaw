name: iOS Build

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ios-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Initialize Simulator Control
        run: xcrun simctl list > /dev/null

      - name: Download iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Inspect Xcode platforms
        run: |
          xcode-select -p
          xcodebuild -version

          echo "=== Installed SDKs ==="
          xcodebuild -showsdks

          echo "=== iOS Platform ==="
          ls -la /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/

          echo "=== Available destinations ==="
          xcodebuild -scheme Jaaw -project Jaaw.xcodeproj -showdestinations

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Inspect generated project
        run: |
          echo "=== SUPPORTED PLATFORMS ==="
          grep -R "SUPPORTED_PLATFORMS" Jaaw.xcodeproj/project.pbxproj || true

          echo "=== SDKROOT ==="
          grep -R "SDKROOT" Jaaw.xcodeproj/project.pbxproj || true

          echo "=== TARGETED DEVICE FAMILY ==="
          grep -R "TARGETED_DEVICE_FAMILY" Jaaw.xcodeproj/project.pbxproj || true

      - name: Build
        run: |
          xcodebuild \
          -project Jaaw.xcodeproj \
          -scheme Jaaw \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          mkdir -p artifacts
          cp -R build/Build/Products/Release-iphoneos/Jaaw.app artifacts/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: jaaw-ios-build
          path: ios-app/artifacts/Jaaw.app